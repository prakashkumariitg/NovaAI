<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Meeting Assistant</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js">
    function setCheckmark(stepEl) {
      stepEl.classList.add('completed');
      const iconContainer = stepEl.querySelector('.step-icon');
      iconContainer.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw-check" d="M5 13l4 4L19 7" />
        </svg>
      `;
    }

  
    
    window.downloadFullRecord = function(format) {
      if (!globalMeetingRecord) return;
      if (format === 'json') {
        const fullPayload = {
          raw_transcript: globalRawTranscript,
          refined_transcript: globalRefinedTranscript,
          ...globalMeetingRecord
        };
        downloadBlob(JSON.stringify(fullPayload, null, 2), 'full_meeting_record.json', 'application/json');
      } else if (format === 'md') {
        let md = `# Full Meeting Record

`;
        md += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
        
        md += `## Action Items
`;
        if (globalMeetingRecord.tasks && globalMeetingRecord.tasks.length > 0) {
          globalMeetingRecord.tasks.forEach(t => md += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
        } else {
          md += `*No action items recorded.*
`;
        }
        
        md += `
## Key Decisions
`;
        if (globalMeetingRecord.decisions && globalMeetingRecord.decisions.length > 0) {
          globalMeetingRecord.decisions.forEach(d => md += `- ${d}
`);
        } else {
          md += `*No key decisions recorded.*
`;
        }
        
        md += `
## Minutes
`;
        if (globalMeetingRecord.minutes && globalMeetingRecord.minutes.length > 0) {
          globalMeetingRecord.minutes.forEach(m => md += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
        } else {
          md += `*No minutes recorded.*
`;
        }
        
        md += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
        md += `
---

## Raw Transcript

${globalRawTranscript}
`;
        
        downloadBlob(md, 'full_meeting_record.md', 'text/markdown');
      }
    };

    // Download logic
    function downloadBlob(content, filename, contentType) {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    
    window.downloadTranscript = function(type) {
      if (!globalRawTranscript && !globalRefinedTranscript) return;
      if (type === 'raw') {
        downloadBlob(globalRawTranscript, 'raw_transcript.txt', 'text/plain');
      } else {
        downloadBlob(globalRefinedTranscript, 'refined_transcript.txt', 'text/plain');
      }
    };

    
    let currentDownloadTarget = null;

    window.openFormatModal = function(target) {
      currentDownloadTarget = target;
      const modal = document.getElementById('format-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // small animation frame trick for pop-in
      requestAnimationFrame(() => {
        modal.querySelector('.glass').classList.remove('scale-95');
        modal.querySelector('.glass').classList.add('scale-100');
      });
    };

    window.closeFormatModal = function() {
      const modal = document.getElementById('format-modal');
      modal.querySelector('.glass').classList.remove('scale-100');
      modal.querySelector('.glass').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        currentDownloadTarget = null;
      }, 150);
    };

    window.confirmDownload = function(format) {
      closeFormatModal();
      if (!currentDownloadTarget) return;

      let fileContent = "";
      let filename = "";
      let mimeType = format === 'md' ? 'text/markdown' : (format === 'json' ? 'application/json' : 'text/plain');

      if (currentDownloadTarget === 'transcript-raw') {
          fileContent = globalRawTranscript;
          filename = `raw_transcript.${format}`;
      } else if (currentDownloadTarget === 'transcript-refined') {
          fileContent = globalRefinedTranscript;
          filename = `refined_transcript.${format}`;
      } else if (currentDownloadTarget === 'summary') {
          fileContent = format === 'md' ? `# Executive Summary\n\n` : `EXECUTIVE SUMMARY\n\n`;
          fileContent += globalMeetingRecord.summary;
          filename = `summary.${format}`;
      } else if (currentDownloadTarget === 'minutes') {
          fileContent = format === 'md' ? `# Meeting Minutes\n\n` : `MEETING MINUTES\n\n`;
          (globalMeetingRecord.minutes || []).forEach(m => {
              if (format === 'md') {
                  fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`;
              } else {
                  fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`;
              }
          });
          filename = `minutes.${format}`;
      } else if (currentDownloadTarget === 'decisions') {
          fileContent = format === 'md' ? `# Key Decisions\n\n` : `KEY DECISIONS\n\n`;
          (globalMeetingRecord.decisions || []).forEach(d => {
              fileContent += format === 'md' ? `- ${d}
` : `* ${d}
`;
          });
          filename = `decisions.${format}`;
      } else if (currentDownloadTarget === 'tasks') {
          fileContent = format === 'md' ? `# Action Items\n\n` : `ACTION ITEMS\n\n`;
          (globalMeetingRecord.tasks || []).forEach(t => {
              if (format === 'md') {
                  fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`;
              } else {
                  fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`;
              }
          });
          filename = `action_items.${format}`;
      } else if (currentDownloadTarget === 'full') {
          if (format === 'json') {
              const fullPayload = { raw_transcript: globalRawTranscript, refined_transcript: globalRefinedTranscript, ...globalMeetingRecord };
              fileContent = JSON.stringify(fullPayload, null, 2);
          } else if (format === 'md') {
              fileContent = `# Full Meeting Record

`;
              fileContent += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `## Action Items
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
              fileContent += `
## Key Decisions
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `- ${d}
`);
              fileContent += `
## Minutes
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
              fileContent += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
              fileContent += `
---

## Raw Transcript

${globalRawTranscript}
`;
          } else {
              fileContent = `FULL MEETING RECORD
===================

`;
              fileContent += `EXECUTIVE SUMMARY
-----------------
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `ACTION ITEMS
------------
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`);
              fileContent += `
KEY DECISIONS
-------------
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `* ${d}
`);
              fileContent += `
MINUTES
-------
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`);
              fileContent += `
REFINED TRANSCRIPT
------------------
${globalRefinedTranscript}
`;
              fileContent += `
RAW TRANSCRIPT
--------------
${globalRawTranscript}
`;
          }
          filename = `full_meeting_record.${format}`;
      }

      downloadBlob(fileContent, filename, mimeType);
    };

  </script>
  <style>
    :root {
      --bg-color: #0A0E27;
      --card-bg: rgba(26, 31, 61, 0.7);
      --card-border: 1px solid rgba(255, 255, 255, 0.08);
      --accent-indigo: #4F46E5;
      --accent-teal: #14B8A6;
      --accent-purple: #8B5CF6;
      --success-green: #10B981;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Mesh Gradient */
    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.15), transparent 25%);
      animation: driftMesh 25s infinite alternate ease-in-out;
    }

    @keyframes driftMesh {
      0% {
        background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 30%),
                    radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.15), transparent 30%);
      }
      100% {
        background: radial-gradient(circle at 85% 50%, rgba(79, 70, 229, 0.15), transparent 40%),
                    radial-gradient(circle at 15% 30%, rgba(20, 184, 166, 0.15), transparent 40%);
      }
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Screen Transitions */
    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      min-height: 100vh;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* Logo Glow */
    .logo-pulse {
      animation: breatheGlow 4s infinite ease-in-out;
    }
    @keyframes breatheGlow {
      0%, 100% { filter: drop-shadow(0 0 4px var(--accent-teal)); }
      50% { filter: drop-shadow(0 0 12px var(--accent-indigo)); }
    }

    /* Upload Zone */
        .upload-zone-wrapper {
      width: 400px;
      height: 250px;
      border-radius: 24px;
      border: 2px dashed rgba(79, 70, 229, 0.6);
      background: rgba(26, 31, 61, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }
    .upload-zone-wrapper:hover {
      border-color: rgba(20, 184, 166, 0.9);
      background: rgba(26, 31, 61, 0.7);
    }
    
    .mic-bob {
      animation: bob 3s infinite ease-in-out;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
