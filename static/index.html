<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Meeting Assistant</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    function setCheckmark(stepEl) {
      stepEl.classList.add('completed');
      const iconContainer = stepEl.querySelector('.step-icon');
      iconContainer.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw-check" d="M5 13l4 4L19 7" />
        </svg>
      `;
    }

  
    
    window.downloadFullRecord = function(format) {
      if (!globalMeetingRecord) return;
      if (format === 'json') {
        const fullPayload = {
          raw_transcript: globalRawTranscript,
          refined_transcript: globalRefinedTranscript,
          ...globalMeetingRecord
        };
        downloadBlob(JSON.stringify(fullPayload, null, 2), 'full_meeting_record.json', 'application/json');
      } else if (format === 'md') {
        let md = `# Full Meeting Record

`;
        md += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
        
        md += `## Action Items
`;
        if (globalMeetingRecord.tasks && globalMeetingRecord.tasks.length > 0) {
          globalMeetingRecord.tasks.forEach(t => md += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
        } else {
          md += `*No action items recorded.*
`;
        }
        
        md += `
## Key Decisions
`;
        if (globalMeetingRecord.decisions && globalMeetingRecord.decisions.length > 0) {
          globalMeetingRecord.decisions.forEach(d => md += `- ${d}
`);
        } else {
          md += `*No key decisions recorded.*
`;
        }
        
        md += `
## Minutes
`;
        if (globalMeetingRecord.minutes && globalMeetingRecord.minutes.length > 0) {
          globalMeetingRecord.minutes.forEach(m => md += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
        } else {
          md += `*No minutes recorded.*
`;
        }
        
        md += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
        md += `
---

## Raw Transcript

${globalRawTranscript}
`;
        
        downloadBlob(md, 'full_meeting_record.md', 'text/markdown');
      }
    };

    // Download logic
    function downloadBlob(content, filename, contentType) {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    
    window.downloadTranscript = function(type) {
      if (!globalRawTranscript && !globalRefinedTranscript) return;
      if (type === 'raw') {
        downloadBlob(globalRawTranscript, 'raw_transcript.txt', 'text/plain');
      } else {
        downloadBlob(globalRefinedTranscript, 'refined_transcript.txt', 'text/plain');
      }
    };

    
    let currentDownloadTarget = null;

    window.openFormatModal = function(target) {
      currentDownloadTarget = target;
      const modal = document.getElementById('format-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // small animation frame trick for pop-in
      requestAnimationFrame(() => {
        modal.querySelector('.glass').classList.remove('scale-95');
        modal.querySelector('.glass').classList.add('scale-100');
      });
    };

    window.closeFormatModal = function() {
      const modal = document.getElementById('format-modal');
      modal.querySelector('.glass').classList.remove('scale-100');
      modal.querySelector('.glass').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        currentDownloadTarget = null;
      }, 150);
    };

    window.confirmDownload = function(format) {
      closeFormatModal();
      if (!currentDownloadTarget) return;

      let fileContent = "";
      let filename = "";
      let mimeType = format === 'md' ? 'text/markdown' : (format === 'json' ? 'application/json' : 'text/plain');

      if (currentDownloadTarget === 'transcript-raw') {
          fileContent = globalRawTranscript;
          filename = `raw_transcript.${format}`;
      } else if (currentDownloadTarget === 'transcript-refined') {
          fileContent = globalRefinedTranscript;
          filename = `refined_transcript.${format}`;
      } else if (currentDownloadTarget === 'summary') {
          fileContent = format === 'md' ? `# Executive Summary\n\n` : `EXECUTIVE SUMMARY\n\n`;
          fileContent += globalMeetingRecord.summary;
          filename = `summary.${format}`;
      } else if (currentDownloadTarget === 'minutes') {
          fileContent = format === 'md' ? `# Meeting Minutes\n\n` : `MEETING MINUTES\n\n`;
          (globalMeetingRecord.minutes || []).forEach(m => {
              if (format === 'md') {
                  fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`;
              } else {
                  fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`;
              }
          });
          filename = `minutes.${format}`;
      } else if (currentDownloadTarget === 'decisions') {
          fileContent = format === 'md' ? `# Key Decisions\n\n` : `KEY DECISIONS\n\n`;
          (globalMeetingRecord.decisions || []).forEach(d => {
              fileContent += format === 'md' ? `- ${d}
` : `* ${d}
`;
          });
          filename = `decisions.${format}`;
      } else if (currentDownloadTarget === 'tasks') {
          fileContent = format === 'md' ? `# Action Items\n\n` : `ACTION ITEMS\n\n`;
          (globalMeetingRecord.tasks || []).forEach(t => {
              if (format === 'md') {
                  fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`;
              } else {
                  fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`;
              }
          });
          filename = `action_items.${format}`;
      } else if (currentDownloadTarget === 'full') {
          if (format === 'json') {
              const fullPayload = { raw_transcript: globalRawTranscript, refined_transcript: globalRefinedTranscript, ...globalMeetingRecord };
              fileContent = JSON.stringify(fullPayload, null, 2);
          } else if (format === 'md') {
              fileContent = `# Full Meeting Record

`;
              fileContent += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `## Action Items
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
              fileContent += `
## Key Decisions
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `- ${d}
`);
              fileContent += `
## Minutes
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
              fileContent += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
              fileContent += `
---

## Raw Transcript

${globalRawTranscript}
`;
          } else {
              fileContent = `FULL MEETING RECORD
===================

`;
              fileContent += `EXECUTIVE SUMMARY
-----------------
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `ACTION ITEMS
------------
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`);
              fileContent += `
KEY DECISIONS
-------------
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `* ${d}
`);
              fileContent += `
MINUTES
-------
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`);
              fileContent += `
REFINED TRANSCRIPT
------------------
${globalRefinedTranscript}
`;
              fileContent += `
RAW TRANSCRIPT
--------------
${globalRawTranscript}
`;
          }
          filename = `full_meeting_record.${format}`;
      }

      downloadBlob(fileContent, filename, mimeType);
    };

  </script>
  <style>
    :root {
      --bg-color: #0A0E27;
      --card-bg: rgba(26, 31, 61, 0.7);
      --card-border: 1px solid rgba(255, 255, 255, 0.08);
      --accent-indigo: #4F46E5;
      --accent-teal: #14B8A6;
      --accent-purple: #8B5CF6;
      --success-green: #10B981;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Mesh Gradient */
    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.15), transparent 25%);
      animation: driftMesh 25s infinite alternate ease-in-out;
    }

    @keyframes driftMesh {
      0% {
        background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 30%),
                    radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.15), transparent 30%);
      }
      100% {
        background: radial-gradient(circle at 85% 50%, rgba(79, 70, 229, 0.15), transparent 40%),
                    radial-gradient(circle at 15% 30%, rgba(20, 184, 166, 0.15), transparent 40%);
      }
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Screen Transitions */
    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      min-height: 100vh;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* Logo Glow */
    .logo-pulse {
      animation: breatheGlow 4s infinite ease-in-out;
    }
    @keyframes breatheGlow {
      0%, 100% { filter: drop-shadow(0 0 4px var(--accent-teal)); }
      50% { filter: drop-shadow(0 0 12px var(--accent-indigo)); }
    }

    /* Upload Zone */
    .upload-zone-wrapper {
      width: 400px;
      height: 250px;
      border-radius: 24px;
      border: 2px dashed rgba(79, 70, 229, 0.6);
      background: rgba(26, 31, 61, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }
    .upload-zone-wrapper:hover {
      border-color: rgba(20, 184, 166, 0.9);
      background: rgba(26, 31, 61, 0.7);
    }
    




    /* Feature Pills */
    .pill-slide-in {
      opacity: 0;
      transform: translateY(20px);
      animation: slideUpFade 0.6s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    .pill-icon svg {
      width: 20px; height: 20px;
    }

    /* EQ Animation */
    .eq-bar {
      transform-origin: bottom;
      animation: eqBounce 1s infinite alternate ease-in-out;
    }
    .eq-bar:nth-child(2) { animation-duration: 0.8s; }
    .eq-bar:nth-child(3) { animation-duration: 1.2s; }
    .eq-bar:nth-child(4) { animation-duration: 0.7s; }
    .eq-bar:nth-child(5) { animation-duration: 1.1s; }
    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    /* Draw Checkmark */
    .draw-check {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLine 1s forwards ease-out 0.5s;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    /* Screen 2 Pipeline */
    .pipeline-step {
      opacity: 0.4;
      transition: all 0.5s ease;
      position: relative;
    }
    .pipeline-step.active {
      opacity: 1;
      box-shadow: 0 0 20px rgba(20, 184, 166, 0.3);
      border-color: rgba(20, 184, 166, 0.5);
    }
    .pipeline-step.completed .step-icon {
      color: var(--success-green);
    }
    
    .spinner-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px dashed var(--accent-teal);
      animation: spin 3s linear infinite;
      opacity: 0;
      pointer-events: none;
    }
    .pipeline-step.active .spinner-ring {
      opacity: 1;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .connection-line {
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 50%, transparent 50%);
      background-size: 10px 2px;
      flex-grow: 1;
      margin: 0 16px;
      position: relative;
    }
    .connection-line.active {
      background: linear-gradient(90deg, var(--accent-teal) 50%, transparent 50%);
      background-size: 10px 2px;
      animation: dashFlow 1s linear infinite;
      box-shadow: 0 0 8px rgba(20, 184, 166, 0.5);
    }
    @keyframes dashFlow {
      to { background-position: -20px 0; }
    }

    /* Sonar Rings */
    .sonar-container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .sonar-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid var(--accent-teal);
      animation: sonarPing 3s infinite cubic-bezier(0, 0, 0.2, 1);
      opacity: 0;
    }
    .sonar-ring:nth-child(2) { animation-delay: 1s; }
    .sonar-ring:nth-child(3) { animation-delay: 2s; }
    @keyframes sonarPing {
      0% { width: 40px; height: 40px; opacity: 0.8; }
      100% { width: 150px; height: 150px; opacity: 0; }
    }

    /* Typewriter */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: var(--accent-teal);
      animation: blink 0.7s infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Screen 3 */
    .scanner-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(20, 184, 166, 0.5);
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.8);
      z-index: -1;
      animation: scanSweep 10s infinite linear;
      opacity: 0.5;
    }
    @keyframes scanSweep {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(100vh); }
    }

    .stagger-up {
      opacity: 0;
      transform: translateY(20px);
    }
    .stagger-up.show {
      animation: slideUpFade 0.6s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .tab-underline {
      position: absolute;
      bottom: -1px;
      height: 2px;
      background-color: var(--accent-teal);
      transition: all 0.3s ease;
    }

    .highlight-pulse {
      color: var(--accent-teal);
      text-shadow: 0 0 8px rgba(20, 184, 166, 0.4);
      animation: textPulse 2s infinite alternate;
    }
    @keyframes textPulse {
      to { text-shadow: 0 0 12px rgba(20, 184, 166, 0.8); }
    }

    .summary-border-anim {
      position: relative;
    }
    .summary-border-anim::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: linear-gradient(45deg, var(--accent-indigo), var(--accent-teal), var(--accent-purple));
      background-size: 200% 200%;
      z-index: -1;
      animation: gradientShift 6s infinite alternate;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .timeline-dot {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .timeline-item:hover .timeline-dot {
      transform: scale(1.5);
      box-shadow: 0 0 10px var(--accent-teal);
    }

    .task-card {
      transition: all 0.2s ease;
    }
    .task-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
      border-color: rgba(20, 184, 166, 0.3);
    }
    .priority-pulse {
      animation: priorityBreathe 2s infinite alternate;
    }
    @keyframes priorityBreathe {
      to { box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
    }

    .btn-download {
      animation: floatBtn 5s infinite ease-in-out;
    }
    .btn-download:hover svg {
      animation: spinIcon 0.4s ease forwards;
    }
    @keyframes floatBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes spinIcon {
      to { transform: rotate(360deg); }
    }
    
    .blur-to-sharp {
      filter: blur(10px);
      opacity: 0;
      animation: blurSharp 0.8s forwards ease-out;
    }
    @keyframes blurSharp {
      to { filter: blur(0); opacity: 1; }
    }

  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="scanner-line hidden" id="scanner-line"></div>

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 p-4">
    <div class="max-w-6xl mx-auto glass flex justify-between items-center px-6 py-3">
      <div class="flex items-center space-x-3 logo-pulse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-teal-400">
          <path d="M12 2L12 22M6 8L6 16M18 8L18 16M2 12L4 12M20 12L22 12" stroke-linecap="round"/>
        </svg>
        <span class="font-bold text-lg tracking-wide text-white">Nova<span class="text-teal-400">AI</span></span>
      </div>
      <button onclick="location.reload()" class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm font-medium text-slate-300 hover:text-white transition-colors border border-white/5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>New Meeting</span>
      </button>
    </div>
  </nav>

  <!-- SCREEN 1: LANDING -->
  <div id="screen-1" class="screen active pt-32 px-4 flex-col items-center justify-center relative">
    
    <div class="relative w-[400px] h-[250px] mb-16 flex items-center justify-center">
      <input type="file" id="file-input" class="hidden" accept="audio/*" onchange="handleFileSelected(event)" />
      <label for="file-input" class="upload-zone-wrapper p-8 flex flex-col items-center justify-center w-full h-full" id="upload-zone" style="cursor: pointer;">
        <div class="mb-4 pointer-events-none">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-indigo-400">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </div>
        <h3 class="text-xl font-semibold mb-2 text-white text-center pointer-events-none">Click here to upload the audio file</h3>
        <p class="text-xs text-slate-400 text-center pointer-events-none">Supports WAV, MP3, M4A, AAC, FLAC, OGG, WEBM</p>
        <p class="text-[11px] text-teal-400/70 font-semibold mt-1.5 uppercase tracking-wider text-center pointer-events-none">Maximum file size: 2 GB</p>
      </label>
    </div>

    <div class="flex space-x-6">
      <div class="glass px-5 py-2.5 flex items-center space-x-3 rounded-full pill-slide-in delay-1">
        <div class="pill-icon text-teal-400 flex items-end h-4 space-x-[2px]">
          <div class="w-1 h-full bg-current eq-bar"></div>
          <div class="w-1 h-full bg-current eq-bar"></div>
          <div class="w-1 h-full bg-current eq-bar"></div>
          <div class="w-1 h-full bg-current eq-bar"></div>
          <div class="w-1 h-full bg-current eq-bar"></div>
        </div>
        <span class="text-sm font-medium text-slate-200">Transcribe</span>
      </div>
      <div class="glass px-5 py-2.5 flex items-center space-x-3 rounded-full pill-slide-in delay-2">
        <div class="pill-icon text-indigo-400">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
          </svg>
        </div>
        <span class="text-sm font-medium text-slate-200">AI Refine</span>
      </div>
      <div class="glass px-5 py-2.5 flex items-center space-x-3 rounded-full pill-slide-in delay-3">
        <div class="pill-icon text-green-400">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <path class="draw-check" d="M9 14l2 2 4-4" />
          </svg>
        </div>
        <span class="text-sm font-medium text-slate-200">Document</span>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: PROCESSING -->
  <div id="screen-2" class="screen pt-32 px-4 flex-col items-center justify-center">
    <div class="w-full max-w-4xl">
      
      <!-- Pipeline -->
      <div class="flex items-center justify-between mb-16">
        
        <!-- Step 1 -->
        <div class="flex flex-col items-center w-32" id="step-1">
          <div class="glass w-16 h-16 rounded-full flex items-center justify-center mb-4 pipeline-step active">
            <div class="spinner-ring"></div>

        <svg class="w-5 h-5 text-red-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              </button></div>

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

        <line x1="12" y1="15" x2="12" y2="3"/>

  <style>
    .show-delay-1 { animation-delay: 0.1s; }
    .show-delay-2 { animation-delay: 0.2s; }
    .show-delay-3 { animation-delay: 0.3s; }
    .show-delay-4 { animation-delay: 0.4s; }
    .show-delay-5 { animation-delay: 0.5s; }
    
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
  </style>

  <script>
    
    // --- State Flow ---
    window.handleFileSelected = async function(e) {
      if (!e.target.files || !e.target.files.length) return;
      const file = e.target.files[0];
      
      const wrapper = document.getElementById('upload-zone');
      wrapper.style.filter = 'brightness(1.5)';
      
      // Clear value immediately so it can be re-selected next time
      e.target.value = '';
      
      setTimeout(() => {
        const s1 = document.getElementById('screen-1');
        const s2 = document.getElementById('screen-2');
        s1.classList.remove('active');
        setTimeout(() => {
          s2.classList.add('active');
          startPipeline(file);
        }, 500);
      }, 300);
    };

    document.getElementById('upload-zone').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('file-input').click();
    });
    
    const s1 = document.getElementById('screen-1');
const s2 = document.getElementById('screen-2');
    const s3 = document.getElementById('screen-3');
    
    
    let globalMeetingRecord = null;
    let globalRawTranscript = "";
    let globalRefinedTranscript = "";



    

      

    async function startPipeline(file) {
      const step1 = document.querySelector('#step-1 .pipeline-step');
      const step2 = document.querySelector('#step-2 .pipeline-step');
      const step3 = document.querySelector('#step-3 .pipeline-step');
      
      const conn1 = document.getElementById('conn-1');
      const conn2 = document.getElementById('conn-2');

      const twEl = document.getElementById('typewriter-text');
      twEl.innerHTML = '<span class="typewriter-cursor"></span>';
      
      let charIndex = 0;
      const fakeTypewriterText = "Processing audio file... Extracting features... Passing to speech-to-text model...";
      let twInterval = setInterval(() => {
        if(charIndex < fakeTypewriterText.length) {
          twEl.innerHTML = fakeTypewriterText.substring(0, charIndex+1) + '<span class="typewriter-cursor"></span>';
          charIndex++;
        }
      }, 50);

      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
            let errorMsg = 'Failed to process audio';
            try {
                const errorData = await response.json();
                if (errorData.detail) errorMsg = errorData.detail;
            } catch (e) {}
            alert('Error: ' + errorMsg);
            location.reload();
            return;
        }

        const data = await response.json();
        globalRawTranscript = data.raw_transcript;
        globalRefinedTranscript = data.refined_transcript;
        globalMeetingRecord = data.meeting_record;
        
        clearInterval(twInterval);
        
        // Fast forward the visual steps
        setCheckmark(step1); document.getElementById('sonar-1').classList.add('hidden');
        step1.classList.remove('active'); conn1.classList.add('active');
        step2.classList.add('active'); document.getElementById('sonar-2').classList.remove('hidden');
        
        setTimeout(() => {
            setCheckmark(step2); document.getElementById('sonar-2').classList.add('hidden');
            step2.classList.remove('active'); conn2.classList.add('active');
            step3.classList.add('active'); document.getElementById('sonar-3').classList.remove('hidden');
            
            setTimeout(() => {
                setCheckmark(step3); document.getElementById('sonar-3').classList.add('hidden');
                
                setTimeout(() => {
                  s2.classList.remove('active');
                  setTimeout(() => {
                    s3.classList.add('active');
                    initScreen3();
                  }, 500);
                }, 800);
            }, 500);
        }, 500);
        
      } catch (err) {
        alert(err.message);
      }
    }

    function initScreen3() {
      document.getElementById('scanner-line').classList.remove('hidden');
      document.getElementById('download-btns').classList.remove('hidden');
      
      const staggers = document.querySelectorAll('.stagger-up');
      staggers.forEach(el => el.classList.add('show'));

      document.getElementById('transcript-content').innerHTML = `<div class="blur-to-sharp">${globalRawTranscript}</div>`;
      
      // Populate Summary
      document.getElementById('summary-content').textContent = globalMeetingRecord.summary || "No summary available.";
      
      // Populate Minutes
      const minutesHtml = (globalMeetingRecord.minutes || []).map((m, i) => {
          const colors = ['indigo-500', 'teal-500', 'purple-500', 'slate-500'];
          const color = colors[i % colors.length];
          const time = typeof m === 'object' ? m.time : '';
          const topic = typeof m === 'object' ? m.topic : m;
          const details = typeof m === 'object' ? m.details : '';
          return `<div class="timeline-item relative">
            <div class="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-${color} timeline-dot"></div>
            <div class="text-xs text-${color.replace('500','400')} mb-0.5">${time}</div>
            <div class="text-sm text-slate-200">${topic}</div>
            <div class="text-xs text-slate-400 mt-1">${details}</div>
          </div>`;
      }).join('');
      document.getElementById('minutes-container').innerHTML = minutesHtml;

      // Populate Decisions
      const decisionsHtml = (globalMeetingRecord.decisions || []).map(d => `
        <div class="flex items-start bg-white/5 p-3 rounded-lg border border-white/5">
            <svg class="w-5 h-5 text-green-400 mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-sm text-slate-200">${d}</span>
        </div>
      `).join('');
      document.getElementById('decisions-container').innerHTML = decisionsHtml;

      // Populate Tasks
      const tasksHtml = (globalMeetingRecord.tasks || []).map(t => {
          const taskDesc = typeof t === 'object' ? t.task : t;
          const owner = typeof t === 'object' ? t.owner : 'Unspecified';
          const deadline = typeof t === 'object' ? t.deadline : 'Unspecified';
          const ownerInitials = owner.substring(0, 2).toUpperCase();
          return `<div class="task-card bg-white/5 border border-white/10 rounded-xl p-4 flex items-center justify-between">
              <div class="flex items-center">
                <div class="w-4 h-4 rounded-full border-2 border-red-500 priority-pulse mr-3"></div>
                <div>
                  <div class="text-sm font-medium text-slate-100">${taskDesc}</div>
                  <div class="text-xs text-slate-400 flex items-center mt-1">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    ${deadline}
                  </div>
                </div>
              </div>
              <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold border border-indigo-400">${ownerInitials}</div>
              </div>
            </div>`;
      }).join('');
      document.getElementById('tasks-container').innerHTML = tasksHtml;
    }

    window.switchTab = function(tab) {
      const ind = document.getElementById('tab-indicator');
      const rawBtn = document.getElementById('tab-raw');
      const refBtn = document.getElementById('tab-refined');
      const content = document.getElementById('transcript-content');

      if(tab === 'raw') {
        ind.style.left = '0%';
        rawBtn.classList.replace('text-slate-400', 'text-white');
        refBtn.classList.replace('text-white', 'text-slate-400');
        content.innerHTML = `<div class="blur-to-sharp">${globalRawTranscript}</div>`;
      } else {
        ind.style.left = '50%';
        refBtn.classList.replace('text-slate-400', 'text-white');
        rawBtn.classList.replace('text-white', 'text-slate-400');
        content.innerHTML = `<div class="blur-to-sharp">${globalRefinedTranscript}</div>`;
      }
    };

  
    function setCheckmark(stepEl) {
      stepEl.classList.add('completed');
      const iconContainer = stepEl.querySelector('.step-icon');
      iconContainer.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw-check" d="M5 13l4 4L19 7" />
        </svg>
      `;
    }

  
    
    window.downloadFullRecord = function(format) {
      if (!globalMeetingRecord) return;
      if (format === 'json') {
        const fullPayload = {
          raw_transcript: globalRawTranscript,
          refined_transcript: globalRefinedTranscript,
          ...globalMeetingRecord
        };
        downloadBlob(JSON.stringify(fullPayload, null, 2), 'full_meeting_record.json', 'application/json');
      } else if (format === 'md') {
        let md = `# Full Meeting Record

`;
        md += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
        
        md += `## Action Items
`;
        if (globalMeetingRecord.tasks && globalMeetingRecord.tasks.length > 0) {
          globalMeetingRecord.tasks.forEach(t => md += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
        } else {
          md += `*No action items recorded.*
`;
        }
        
        md += `
## Key Decisions
`;
        if (globalMeetingRecord.decisions && globalMeetingRecord.decisions.length > 0) {
          globalMeetingRecord.decisions.forEach(d => md += `- ${d}
`);
        } else {
          md += `*No key decisions recorded.*
`;
        }
        
        md += `
## Minutes
`;
        if (globalMeetingRecord.minutes && globalMeetingRecord.minutes.length > 0) {
          globalMeetingRecord.minutes.forEach(m => md += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
        } else {
          md += `*No minutes recorded.*
`;
        }
        
        md += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
        md += `
---

## Raw Transcript

${globalRawTranscript}
`;
        
        downloadBlob(md, 'full_meeting_record.md', 'text/markdown');
      }
    };

    // Download logic
    function downloadBlob(content, filename, contentType) {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    
    window.downloadTranscript = function(type) {
      if (!globalRawTranscript && !globalRefinedTranscript) return;
      if (type === 'raw') {
        downloadBlob(globalRawTranscript, 'raw_transcript.txt', 'text/plain');
      } else {
        downloadBlob(globalRefinedTranscript, 'refined_transcript.txt', 'text/plain');
      }
    };

    
    let currentDownloadTarget = null;

    window.openFormatModal = function(target) {
      currentDownloadTarget = target;
      const modal = document.getElementById('format-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // small animation frame trick for pop-in
      requestAnimationFrame(() => {
        modal.querySelector('.glass').classList.remove('scale-95');
        modal.querySelector('.glass').classList.add('scale-100');
      });
    };

    window.closeFormatModal = function() {
      const modal = document.getElementById('format-modal');
      modal.querySelector('.glass').classList.remove('scale-100');
      modal.querySelector('.glass').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        currentDownloadTarget = null;
      }, 150);
    };

    window.confirmDownload = function(format) {
      closeFormatModal();
      if (!currentDownloadTarget) return;

      let fileContent = "";
      let filename = "";
      let mimeType = format === 'md' ? 'text/markdown' : (format === 'json' ? 'application/json' : 'text/plain');

      if (currentDownloadTarget === 'transcript-raw') {
          fileContent = globalRawTranscript;
          filename = `raw_transcript.${format}`;
      } else if (currentDownloadTarget === 'transcript-refined') {
          fileContent = globalRefinedTranscript;
          filename = `refined_transcript.${format}`;
      } else if (currentDownloadTarget === 'summary') {
          fileContent = format === 'md' ? `# Executive Summary\n\n` : `EXECUTIVE SUMMARY\n\n`;
          fileContent += globalMeetingRecord.summary;
          filename = `summary.${format}`;
      } else if (currentDownloadTarget === 'minutes') {
          fileContent = format === 'md' ? `# Meeting Minutes\n\n` : `MEETING MINUTES\n\n`;
          (globalMeetingRecord.minutes || []).forEach(m => {
              if (format === 'md') {
                  fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`;
              } else {
                  fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`;
              }
          });
          filename = `minutes.${format}`;
      } else if (currentDownloadTarget === 'decisions') {
          fileContent = format === 'md' ? `# Key Decisions\n\n` : `KEY DECISIONS\n\n`;
          (globalMeetingRecord.decisions || []).forEach(d => {
              fileContent += format === 'md' ? `- ${d}
` : `* ${d}
`;
          });
          filename = `decisions.${format}`;
      } else if (currentDownloadTarget === 'tasks') {
          fileContent = format === 'md' ? `# Action Items\n\n` : `ACTION ITEMS\n\n`;
          (globalMeetingRecord.tasks || []).forEach(t => {
              if (format === 'md') {
                  fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`;
              } else {
                  fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`;
              }
          });
          filename = `action_items.${format}`;
      } else if (currentDownloadTarget === 'full') {
          if (format === 'json') {
              const fullPayload = { raw_transcript: globalRawTranscript, refined_transcript: globalRefinedTranscript, ...globalMeetingRecord };
              fileContent = JSON.stringify(fullPayload, null, 2);
          } else if (format === 'md') {
              fileContent = `# Full Meeting Record

`;
              fileContent += `## Executive Summary
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `## Action Items
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `- [ ] **${t.task}** (Owner: ${t.owner}, Deadline: ${t.deadline})
`);
              fileContent += `
## Key Decisions
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `- ${d}
`);
              fileContent += `
## Minutes
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `- **${m.time || 'Unspecified'}**: ${m.topic}
  ${m.details}
`);
              fileContent += `
---

## Refined Transcript

${globalRefinedTranscript}
`;
              fileContent += `
---

## Raw Transcript

${globalRawTranscript}
`;
          } else {
              fileContent = `FULL MEETING RECORD
===================

`;
              fileContent += `EXECUTIVE SUMMARY
-----------------
${globalMeetingRecord.summary || 'N/A'}

`;
              fileContent += `ACTION ITEMS
------------
`;
              (globalMeetingRecord.tasks || []).forEach(t => fileContent += `[ ] ${t.task} | Owner: ${t.owner} | Deadline: ${t.deadline}
`);
              fileContent += `
KEY DECISIONS
-------------
`;
              (globalMeetingRecord.decisions || []).forEach(d => fileContent += `* ${d}
`);
              fileContent += `
MINUTES
-------
`;
              (globalMeetingRecord.minutes || []).forEach(m => fileContent += `[${m.time || 'Unspecified'}] ${m.topic}
${m.details}

`);
              fileContent += `
REFINED TRANSCRIPT
------------------
${globalRefinedTranscript}
`;
              fileContent += `
RAW TRANSCRIPT
--------------
${globalRawTranscript}
`;
          }
          filename = `full_meeting_record.${format}`;
      }

      downloadBlob(fileContent, filename, mimeType);
    };

  </script>

  <!-- Format Selection Modal -->
  <div id="format-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-[#0A0E27]/80 backdrop-blur-sm transition-opacity">
    <div class="glass p-6 rounded-2xl w-80 flex flex-col gap-3 shadow-2xl border border-white/20 scale-95 transform transition-transform">
      <h3 class="text-white font-bold text-center mb-2">Select Format</h3>
      <button onclick="confirmDownload('md')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white font-medium transition-colors shadow-[0_0_15px_rgba(79,70,229,0.4)]">Markdown (.md)</button>
      <button onclick="confirmDownload('txt')" class="w-full py-3 bg-[#1A1F3D] hover:bg-[#252b52] border border-white/10 rounded-lg text-white font-medium transition-colors">Plain Text (.txt)</button>
      <button onclick="confirmDownload('json')" class="w-full py-3 bg-[#131835] hover:bg-[#1f264d] border border-white/10 rounded-lg text-white font-medium transition-colors shadow-inner">JSON (.json)</button>
      <button onclick="closeFormatModal()" class="mt-3 text-slate-400 hover:text-white text-sm transition-colors">Cancel</button>
    </div>
  </div>

</body>
</html>
